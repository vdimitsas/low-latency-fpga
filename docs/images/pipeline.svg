<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="600" viewBox="0 0 1520 600" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#7a7a7a" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1520" height="600" fill="#ffffff"/>

  <text x="56" y="248" font-size="12" fill="#5a5a5a">N feeds</text>
  <line x1="56" y1="266" x2="118" y2="266" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>

  <rect x="128" y="234" width="150" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="203" y="262" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SEQ_EXTRACT</text>
  <text x="203" y="281" font-size="11" fill="#6a6a6a" text-anchor="middle">extracts sequence ID</text>

  <line x1="278" y1="266" x2="336" y2="266" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>

  <rect x="346" y="234" width="150" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="421" y="262" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DEDUP_INGRESS</text>
  <text x="421" y="281" font-size="11" fill="#6a6a6a" text-anchor="middle">drops served copies</text>

  <line x1="496" y1="266" x2="554" y2="266" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>

  <rect x="564" y="234" width="150" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="639" y="262" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FEED_BUFFER</text>
  <text x="639" y="281" font-size="11" fill="#6a6a6a" text-anchor="middle">per-feed FIFOs</text>

  <line x1="714" y1="266" x2="772" y2="266" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>

  <rect x="782" y="234" width="230" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="897" y="262" font-size="13" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MARKET_LINE_ARBITER</text>
  <text x="897" y="281" font-size="11" fill="#6a6a6a" text-anchor="middle">selects one feed</text>

  <line x1="1012" y1="266" x2="1080" y2="266" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>

  <rect x="1090" y="234" width="140" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="1160" y="262" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CHECKSUM</text>
  <text x="1160" y="281" font-size="11" fill="#6a6a6a" text-anchor="middle">validates packet</text>

  <path d="M1160 234 L1160 96 L421 96 L421 232" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>
  <text x="778" y="86" font-size="11" fill="#6a6a6a" text-anchor="middle">completion feedback</text>

  <path d="M868 234 L868 168 L673 168 L673 232" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>
  <text x="771" y="158" font-size="11" fill="#6a6a6a" text-anchor="middle">invalidate vector</text>

  <path d="M524 266 L524 482 L614 482" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>
  <rect x="521" y="263" width="6" height="6" fill="#1a1a1a"/>
  <text x="414" y="478" font-size="11" fill="#6a6a6a">packet arrivals</text>

  <path d="M1135 298 L1135 414 L699 414 L699 448" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>
  <path d="M1191 298 L1191 430 L1075 430 L1075 448" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>
  <text x="820" y="405" font-size="11" fill="#6a6a6a" text-anchor="middle">checksum failed</text>

  <rect x="624" y="456" width="180" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="714" y="484" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FIX_TRACKER</text>
  <text x="714" y="503" font-size="11" fill="#6a6a6a" text-anchor="middle">watches for fixes</text>

  <rect x="1000" y="456" width="150" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="1075" y="484" font-size="14" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TIMER</text>
  <text x="1075" y="503" font-size="11" fill="#6a6a6a" text-anchor="middle">fix wait time</text>

  <path d="M804 488 L918 488 L918 300" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>
  <text x="930" y="352" font-size="11" fill="#6a6a6a">fixed feed</text>

  <path d="M804 508 L990 508" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>
  <text x="897" y="528" font-size="11" fill="#6a6a6a" text-anchor="middle">reset timer</text>

  <line x1="1230" y1="266" x2="1278" y2="266" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>

  <rect x="1288" y="234" width="160" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="1368" y="262" font-size="13" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DEDUP_EGRESS</text>
  <text x="1368" y="281" font-size="11" fill="#6a6a6a" text-anchor="middle">final duplicate cut</text>

  <line x1="1448" y1="266" x2="1502" y2="266" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>
  <text x="1475" y="256" font-size="11" fill="#5a5a5a" text-anchor="middle">output</text>

  <line x1="1150" y1="488" x2="1502" y2="488" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>
  <text x="1398" y="478" font-size="11" fill="#5a5a5a" text-anchor="middle">error / loss</text>
</svg>
