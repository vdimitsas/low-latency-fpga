<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="660" viewBox="0 0 1260 660" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1260" height="660" fill="#ffffff"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#111111"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#777777"/>
    </marker>
  </defs>

  <style>
    .blk   { fill:none; stroke:#111111; stroke-width:1.6; }
    .name  { font-family:"DejaVu Sans Mono",monospace; font-size:17px; fill:#111111; }
    .sub   { font-family:"DejaVu Sans",Arial,sans-serif; font-size:13px; fill:#444444; }
    .lbl   { font-family:"DejaVu Sans",Arial,sans-serif; font-size:13px; fill:#111111; }
    .lblg  { font-family:"DejaVu Sans",Arial,sans-serif; font-size:13px; fill:#777777; }
    .data  { fill:none; stroke:#111111; stroke-width:1.6; marker-end:url(#ar); }
    .ctrl  { fill:none; stroke:#777777; stroke-width:1.4; marker-end:url(#arg); }
    .plain { fill:none; stroke:#777777; stroke-width:1.4; }
    .cut   { fill:none; stroke:#777777; stroke-width:1.2; stroke-dasharray:6 5; }
    .title { font-family:"DejaVu Sans Mono",monospace; font-size:20px; fill:#111111; }
  </style>

  <text class="title" x="40" y="44">DEDUP_INGRESS</text>

  <!-- cycle boundary: the output register is the only one on the datapath -->
  <path class="cut" d="M980,150 L980,586"/>
  <text class="lblg" x="962" y="142" text-anchor="end">cycle N</text>
  <text class="lblg" x="998" y="142">cycle N+1</text>

  <!-- in_ready back to upstream, along the top, pointing left -->
  <path class="ctrl" d="M870,290 L870,96 L40,96"/>
  <text class="lblg" x="470" y="88" text-anchor="middle">in_ready to upstream: ~in_valid OR out_ready OR drop, combinational</text>

  <!-- cmpl_seq input -->
  <text class="lblg" x="40" y="292">cmpl_seq</text>
  <text class="lblg" x="40" y="310">(from CHECKSUM)</text>
  <path class="plain" d="M40,324 L170,324"/>
  <circle cx="170" cy="324" r="4.5" fill="#777777"/>

  <!-- same cycle bypass -->
  <path class="ctrl" d="M170,324 L170,196 L578,196 L578,300 L616,300"/>
  <text class="lblg" x="380" y="188">same-cycle bypass</text>

  <!-- into CPT -->
  <path class="ctrl" d="M170,324 L236,324"/>

  <!-- CPT -->
  <rect class="blk" x="240" y="272" width="200" height="104"/>
  <text class="name" x="340" y="312" text-anchor="middle">CPT</text>
  <text class="sub"  x="340" y="334" text-anchor="middle">completed packets table</text>
  <text class="sub"  x="340" y="354" text-anchor="middle">circular, DEPTH=8</text>
  <path class="ctrl" d="M440,324 L616,324"/>

  <!-- in_seq / in_seq_valid input -->
  <text class="lblg" x="40" y="452">in_seq, in_seq_valid</text>
  <text class="lblg" x="40" y="470">(from SEQ_EXTRACT)</text>
  <path class="plain" d="M40,484 L170,484"/>
  <circle cx="170" cy="484" r="4.5" fill="#777777"/>
  <path class="ctrl" d="M170,484 L236,484"/>

  <!-- arriving value straight to the comparison, ahead of the register -->
  <path class="ctrl" d="M170,484 L170,568 L560,568 L560,348 L616,348"/>
  <text class="lblg" x="188" y="552">the arriving number, on the beat it lands</text>

  <!-- SEQ_REGS -->
  <rect class="blk" x="240" y="432" width="200" height="104"/>
  <text class="name" x="340" y="468" text-anchor="middle">SEQ_REGS</text>
  <text class="sub"  x="340" y="490" text-anchor="middle">one seq per feed, written</text>
  <text class="sub"  x="340" y="510" text-anchor="middle">on in_seq_valid, cleared on SOP</text>
  <path class="ctrl" d="M440,462 L530,462 L530,372 L616,372"/>

  <!-- COMPARE -->
  <rect class="blk" x="620" y="284" width="140" height="104"/>
  <text class="name" x="690" y="318" text-anchor="middle">COMPARE</text>
  <text class="sub"  x="690" y="340" text-anchor="middle">cpt_match</text>
  <text class="sub"  x="690" y="358" text-anchor="middle">bypass_match</text>
  <text class="sub"  x="690" y="376" text-anchor="middle">qualified by seq valid</text>

  <!-- COMPARE into DROP -->
  <path class="data" d="M760,336 L796,336"/>

  <!-- DROP -->
  <rect class="blk" x="800" y="294" width="140" height="84"/>
  <text class="name" x="870" y="328" text-anchor="middle">DROP</text>
  <text class="sub"  x="870" y="350" text-anchor="middle">OR reduction,</text>
  <text class="sub"  x="870" y="368" text-anchor="middle">out_valid, in_ready</text>

  <!-- DROP into the output register -->
  <path class="data" d="M940,336 L1016,336"/>

  <!-- feed inputs along the bottom, straight into the output register -->
  <text class="lbl" x="40" y="600">N feeds in</text>
  <path class="data" d="M40,616 L1070,616 L1070,472"/>
  <text class="lblg" x="640" y="636" text-anchor="middle">in_data, in_sop, in_eop pass through unread</text>

  <!-- output register -->
  <rect class="blk" x="1020" y="284" width="110" height="184"/>
  <text class="name" x="1075" y="330" text-anchor="middle">OUT</text>
  <text class="name" x="1075" y="352" text-anchor="middle">REG</text>
  <text class="sub"  x="1075" y="378" text-anchor="middle">enable:</text>
  <text class="sub"  x="1075" y="396" text-anchor="middle">out_ready</text>

  <!-- output -->
  <path class="data" d="M1130,336 L1220,336"/>
  <text class="lbl" x="1148" y="322">N feeds out</text>
</svg>
