<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="660" viewBox="0 0 1260 660" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1260" height="660" fill="#ffffff"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#111111"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#777777"/>
    </marker>
  </defs>

  <style>
    .blk   { fill:none; stroke:#111111; stroke-width:1.6; }
    .name  { font-family:"DejaVu Sans Mono",monospace; font-size:17px; fill:#111111; }
    .sub   { font-family:"DejaVu Sans",Arial,sans-serif; font-size:13px; fill:#444444; }
    .lbl   { font-family:"DejaVu Sans",Arial,sans-serif; font-size:13px; fill:#111111; }
    .lblg  { font-family:"DejaVu Sans",Arial,sans-serif; font-size:13px; fill:#777777; }
    .data  { fill:none; stroke:#111111; stroke-width:1.6; marker-end:url(#ar); }
    .ctrl  { fill:none; stroke:#777777; stroke-width:1.4; marker-end:url(#arg); }
    .plain { fill:none; stroke:#777777; stroke-width:1.4; }
    .cut   { fill:none; stroke:#777777; stroke-width:1.2; stroke-dasharray:6 5; }
    .title { font-family:"DejaVu Sans Mono",monospace; font-size:20px; fill:#111111; }
  </style>

  <text class="title" x="40" y="44">SEQ_EXTRACT_LANE</text>

  <!-- in_ready back to upstream, along the top, pointing left -->
  <path class="ctrl" d="M1015,420 L1015,90 L40,90"/>
  <text class="lblg" x="560" y="82" text-anchor="middle">in_ready: an empty stage accepts, a held beat follows out_ready, combinational</text>

  <!-- the beat stream in, along the bottom -->
  <text class="lbl" x="40" y="590">in_data</text>
  <path class="plain" d="M40,606 L1015,606"/>
  <circle cx="150" cy="606" r="4.5" fill="#777777"/>
  <circle cx="910" cy="606" r="4.5" fill="#777777"/>

  <!-- control riser into the counter and the pending flag -->
  <path class="plain" d="M150,606 L150,195"/>
  <path class="ctrl"  d="M150,195 L236,195"/>
  <path class="ctrl"  d="M150,345 L236,345"/>
  <text class="lblg" x="52" y="430">in_valid</text>
  <text class="lblg" x="52" y="448">in_ready</text>
  <text class="lblg" x="52" y="466">in_sop, in_eop</text>

  <!-- BEAT CNT -->
  <rect class="blk" x="240" y="150" width="180" height="90"/>
  <text class="name" x="330" y="186" text-anchor="middle">BEAT CNT</text>
  <text class="sub"  x="330" y="208" text-anchor="middle">beat index in packet,</text>
  <text class="sub"  x="330" y="226" text-anchor="middle">stops at its top value</text>
  <path class="ctrl" d="M420,195 L455,195 L455,255 L486,255"/>

  <!-- PENDING -->
  <rect class="blk" x="240" y="300" width="180" height="90"/>
  <text class="name" x="330" y="336" text-anchor="middle">PENDING</text>
  <text class="sub"  x="330" y="358" text-anchor="middle">capture still owed,</text>
  <text class="sub"  x="330" y="376" text-anchor="middle">one per packet</text>
  <path class="ctrl" d="M420,345 L455,345 L455,295 L486,295"/>

  <!-- MARKERS -->
  <rect class="blk" x="490" y="220" width="170" height="105"/>
  <text class="name" x="575" y="256" text-anchor="middle">MARKERS</text>
  <text class="sub"  x="575" y="278" text-anchor="middle">at_seq_beat</text>
  <text class="sub"  x="575" y="296" text-anchor="middle">at_next_beat</text>

  <!-- markers clear the pending flag once the field is captured -->
  <path class="ctrl" d="M575,325 L575,465 L330,465 L330,394"/>
  <text class="lblg" x="452" y="483" text-anchor="middle">cleared on capture</text>

  <!-- markers enable the two capture registers -->
  <path class="ctrl" d="M660,240 L690,240 L690,220 L716,220"/>
  <path class="ctrl" d="M660,305 L690,305 L690,372 L716,372"/>

  <!-- the beat data feeds both capture registers -->
  <path class="plain" d="M910,606 L910,180"/>
  <path class="data"  d="M910,180 L894,180"/>
  <path class="data"  d="M910,325 L894,325"/>

  <!-- SEQ LO -->
  <rect class="blk" x="720" y="150" width="170" height="90"/>
  <text class="name" x="805" y="186" text-anchor="middle">SEQ LO</text>
  <text class="sub"  x="805" y="208" text-anchor="middle">low half of a field</text>
  <text class="sub"  x="805" y="226" text-anchor="middle">that spans two beats</text>
  <path class="data" d="M805,240 L805,296"/>

  <!-- SEQ REG -->
  <rect class="blk" x="720" y="300" width="170" height="100"/>
  <text class="name" x="805" y="336" text-anchor="middle">SEQ REG</text>
  <text class="sub"  x="805" y="358" text-anchor="middle">seq_q, and the one</text>
  <text class="sub"  x="805" y="376" text-anchor="middle">cycle valid pulse</text>

  <!-- extracted metadata out -->
  <path class="data" d="M805,400 L805,550 L1220,550"/>
  <text class="lbl" x="1220" y="574" text-anchor="end">out_seq_* interface</text>

  <!-- the beat itself, straight through one register stage -->
  <path class="data" d="M1015,606 L1015,528"/>
  <rect class="blk" x="940" y="420" width="150" height="104"/>
  <text class="name" x="1015" y="460" text-anchor="middle">PIPE REG</text>
  <text class="sub"  x="1015" y="482" text-anchor="middle">data, sop, eop,</text>
  <text class="sub"  x="1015" y="500" text-anchor="middle">byte_cnt, unchanged</text>
  <path class="data" d="M1090,472 L1220,472"/>
  <text class="lbl" x="1220" y="460" text-anchor="end">out_* interface</text>
</svg>
