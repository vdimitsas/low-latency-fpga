<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#7a7a7a" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="560" fill="#ffffff"/>

  <!-- ============ STAGE 1 ============ -->
  <text x="20" y="164" font-size="12" fill="#5a5a5a">feeds</text>
  <line x1="20" y1="182" x2="60" y2="182" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="57" y="179" width="6" height="6" fill="#1a1a1a"/>
  <line x1="60" y1="182" x2="116" y2="182" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>

  <rect x="118" y="150" width="150" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="193" y="178" font-size="13" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">EFF_VIEW</text>
  <text x="193" y="197" font-size="11" fill="#6a6a6a" text-anchor="middle">live or held, per feed</text>

  <line x1="268" y1="182" x2="318" y2="182" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>

  <rect x="320" y="150" width="170" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="405" y="178" font-size="13" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SERVE_MUX</text>
  <text x="405" y="197" font-size="11" fill="#6a6a6a" text-anchor="middle">sticky, fix, index</text>

  <line x1="405" y1="100" x2="405" y2="148" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>
  <text x="405" y="90" font-size="11" fill="#6a6a6a" text-anchor="middle">fix_avail</text>

  <rect x="118" y="300" width="150" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="193" y="328" font-size="13" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SKID BUFFERS</text>
  <text x="193" y="347" font-size="11" fill="#6a6a6a" text-anchor="middle">held, one beat per feed</text>

  <path d="M60 182 L60 332 L116 332" fill="none" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>
  <path d="M193 298 L193 216" fill="none" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>

  <path d="M360 216 L360 400 L200 400 L200 366" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>
  <text x="282" y="393" font-size="11" fill="#6a6a6a" text-anchor="middle">serve_feed</text>

  <!-- ============ BOUNDARY ============ -->
  <line x1="560" y1="60" x2="560" y2="540" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="560" y="46" font-size="11" fill="#8a8a8a" text-anchor="middle">registered</text>

  <line x1="490" y1="182" x2="614" y2="182" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>

  <!-- ============ STAGE 2 ============ -->
  <rect x="616" y="150" width="200" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="716" y="178" font-size="13" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">OUTPUT REGISTERS</text>
  <text x="716" y="197" font-size="11" fill="#6a6a6a" text-anchor="middle">valid, data, seq, sop, eop, feed</text>

  <line x1="816" y1="182" x2="1000" y2="182" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>
  <text x="1050" y="186" font-size="12" fill="#5a5a5a">out_*</text>

  <!-- fan-out point below output registers -->
  <line x1="716" y1="214" x2="716" y2="252" stroke="#7a7a7a" stroke-width="1"/>
  <rect x="713" y="249" width="6" height="6" fill="#7a7a7a"/>

  <!-- left branch to FIX_SERVED -->
  <path d="M716 252 L706 252 L706 288" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>
  <!-- right branch to FIX_SERVED -->
  <path d="M716 252 L946 252 L946 288" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>

  <!-- FIX_SERVED and HICCUP side by side -->
  <rect x="856" y="290" width="180" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="946" y="318" font-size="13" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FIX_SERVED</text>
  <text x="946" y="337" font-size="11" fill="#6a6a6a" text-anchor="middle">reports a fix beat</text>

  <rect x="616" y="290" width="180" height="64" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="706" y="318" font-size="13" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HICCUP + GIVEUP</text>
  <text x="706" y="337" font-size="11" fill="#6a6a6a" text-anchor="middle">counts stalled cycles</text>

  <line x1="1036" y1="322" x2="1100" y2="322" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>
  <text x="1046" y="306" font-size="12" fill="#5a5a5a">fix_served_*</text>

  <path d="M706 354 L706 428" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>

  <rect x="616" y="430" width="180" height="60" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="706" y="456" font-size="13" fill="#1a1a1a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">INVALIDATE_Q</text>
  <text x="706" y="474" font-size="11" fill="#6a6a6a" text-anchor="middle">starvation state</text>

  <line x1="796" y1="460" x2="900" y2="460" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="897" y="457" width="6" height="6" fill="#1a1a1a"/>
  <line x1="900" y1="460" x2="1100" y2="460" stroke="#1a1a1a" stroke-width="1" marker-end="url(#ah)"/>
  <text x="1000" y="446" font-size="12" fill="#5a5a5a">invalidate_feed</text>

  <path d="M900 460 L900 520 L405 520 L405 216" fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#ahg)"/>
  <text x="700" y="514" font-size="11" fill="#6a6a6a" text-anchor="middle">invalidate_feed (delayed)</text>
</svg>
